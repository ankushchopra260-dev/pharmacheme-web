<figure class="yt-lite" style="margin:18px 0 22px;max-width:760px;">
  <button type="button" data-yt="{{ include.id }}" aria-label="Play video: {{ include.title }}" style="position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:1px solid var(--grid-line);border-radius:8px;overflow:hidden;background:#000;cursor:pointer;" onclick="var f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+this.dataset.yt+'?autoplay=1&rel=0';f.title=this.getAttribute('aria-label').replace('Play video: ','');f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';f.allowFullscreen=true;f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0';this.innerHTML='';this.appendChild(f);this.onclick=null;">
    <img src="https://img.youtube.com/vi/{{ include.id }}/hqdefault.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;">
    <span aria-hidden="true" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:52px;border-radius:12px;background:rgba(201,162,39,.95);display:flex;align-items:center;justify-content:center;"><span style="width:0;height:0;border-left:20px solid #0B1622;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:4px;"></span></span>
  </button>
  <figcaption style="font-size:.85rem;color:var(--muted);margin-top:6px;">{{ include.caption }} <a href="https://www.youtube.com/watch?v={{ include.id }}" target="_blank" rel="noopener" style="color:var(--brass)">Watch on YouTube</a></figcaption>
</figure>
