<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCCPL &middot; GET Operations Recruitment Test</title>
<style>
  :root{
    --ink:#20302f;
    --ink-soft:#4a5c5a;
    --paper:#f4f0e6;
    --panel:#fffdf8;
    --line:#d9d2bd;
    --rust:#9c4a22;
    --rust-dark:#7c3a1a;
    --teal:#2c5a54;
    --teal-soft:#e4ece9;
    --amber:#b3791f;
    --alert:#a53324;
    --alert-soft:#f6e2de;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;}
  .app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  .topbar{
    width:100%;
    max-width:640px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:18px;
  }
  .brand{
    font-size:13px;
    letter-spacing:.02em;
    color:var(--ink-soft);
  }
  .brand b{color:var(--ink);}
  .timer{
    font-size:20px;
    font-weight:600;
    padding:4px 10px;
    border:1px solid var(--ink);
    color:var(--ink);
    background:var(--panel);
  }
  .timer.warn{color:var(--amber);border-color:var(--amber);}
  .timer.danger{color:var(--alert);border-color:var(--alert);}
  .card{
    width:100%;
    max-width:640px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px;
  }
  h1{
    font-size:22px;
    margin:0 0 6px;
    font-weight:700;
    color:var(--ink);
  }
  .sub{
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 22px;
  }
  .meta-row{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin:0 0 24px;
    padding:14px 16px;
    background:var(--teal-soft);
    border-left:3px solid var(--teal);
    font-size:13px;
    color:var(--ink);
  }
  .meta-row div b{display:block;font-size:15px;}
  label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:16px 0 5px;
  }
  input[type=text]{
    width:100%;
    padding:11px 12px;
    font-size:15px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  input[type=text]:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    padding:12px 22px;
    border-radius:var(--radius);
    background:var(--rust);
    color:#fff9f2;
    transition:background .12s ease;
  }
  .btn:hover:not(:disabled){background:var(--rust-dark);}
  .btn:disabled{background:#c8c0ab;cursor:not-allowed;}
  .btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn.ghost:hover:not(:disabled){border-color:var(--ink);}
  .actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px;}
  .actions .right{display:flex;gap:10px;}
  .start-actions{margin-top:26px;}
  .err{color:var(--alert);font-size:13px;margin-top:10px;min-height:16px;}

  .progress-track{
    width:100%;max-width:640px;
    display:flex;gap:3px;margin-bottom:20px;
  }
  .progress-tick{flex:1;height:4px;background:var(--line);}
  .progress-tick.answered{background:var(--teal);}
  .progress-tick.current{background:var(--rust);}

  .section-label{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--teal);
    margin-bottom:6px;
    font-weight:600;
  }
  .qcount{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .qtext{
    font-size:18px;
    font-weight:600;
    line-height:1.45;
    margin:0 0 22px;
  }
  .options{display:flex;flex-direction:column;gap:9px;}
  .option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:13px 14px;
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    border-radius:var(--radius);
    cursor:pointer;
    background:#fff;
  }
  .option:hover{border-left-color:var(--teal);}
  .option.selected{
    border-left-color:var(--rust);
    background:#fbf3ec;
  }
  .option .mark{
    width:20px;height:20px;flex:none;
    border:1.5px solid var(--ink-soft);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--ink-soft);
    margin-top:1px;
  }
  .option.selected .mark{
    background:var(--rust);border-color:var(--rust);color:#fff;
  }
  .option .otext{font-size:15px;}

  .palette{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:5px;
    margin-top:26px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  .pcell{
    aspect-ratio:1;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--ink-soft);
    background:#fff;
    cursor:pointer;
  }
  .pcell.answered{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .pcell.current{border-color:var(--rust);color:var(--rust);font-weight:700;}

  .done-icon{font-size:34px;margin-bottom:12px;}
  .hint{font-size:12.5px;color:var(--ink-soft);margin-top:14px;}

  @media (max-width:480px){
    .card{padding:22px 18px;}
    .qtext{font-size:16.5px;}
    .palette{grid-template-columns:repeat(8,1fr);}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

/* ======================================================================
   STATE
   ====================================================================== */
function getParam(name){
  const v = new URLSearchParams(window.location.search).get(name);
  return v ? decodeURIComponent(v) : "";
}

let state = loadState();

function loadState(){
  try{
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && s.startTime && !s.submitted){
        const endTime = s.startTime + TEST_DURATION_MIN*60*1000;
        if(Date.now() < endTime) return s;
      }
      if(s && s.submitted) return s;
    }
  }catch(e){}
  return {
    screen:"start",
    name:"", roll:"", college: getParam("college"),
    answers:{}, currentIndex:0,
    startTime:null, submitted:false
  };
}

function saveState(){
  try{ sessionStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

let timerHandle = null;

/* ======================================================================
   RENDER
   ====================================================================== */
function render(){
  const app = document.getElementById("app");
  if(state.screen === "start") return renderStart(app);
  if(state.screen === "test") return renderTest(app);
  if(state.screen === "done") return renderDone(app);
  if(state.screen === "error") return renderError(app);
}

function renderStart(app){
  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><b>PCCPL</b> &middot; Campus Recruitment</div>
    </div>
    <div class="card">
      <h1>GET &ndash; Operations: Online Screening Test</h1>
      <p class="sub">Punjab Chemical &amp; Crop Protection Ltd &mdash; Graduate Engineer Trainee (Operations)</p>
      <div class="meta-row">
        <div><b>50</b>Total Questions</div>
        <div><b>60 min</b>Time Allowed</div>
        <div><b>30 / 50</b>Qualifying Cutoff</div>
        <div><b>+1</b>Per Correct, No Negative Marking</div>
      </div>
      <label for="f-name">Full Name</label>
      <input type="text" id="f-name" placeholder="As per your ID / application" value="${escapeHtml(state.name)}">
      <label for="f-roll">Roll Number</label>
      <input type="text" id="f-roll" placeholder="e.g. 21ME045" value="${escapeHtml(state.roll)}">
      <label for="f-college">College Name</label>
      <input type="text" id="f-college" placeholder="Your college / institute" value="${escapeHtml(state.college)}">
      <div class="err" id="start-err"></div>
      <div class="start-actions">
        <button class="btn" id="start-btn">Start Test</button>
      </div>
      <p class="hint">Once you start, a 60-minute timer begins and cannot be paused. Do not close or reload this tab &mdash; your progress is kept only for this browser session. The test submits automatically when time runs out.</p>
    </div>
  `;
  document.getElementById("start-btn").onclick = () => {
    const name = document.getElementById("f-name").value.trim();
    const roll = document.getElementById("f-roll").value.trim();
    const college = document.getElementById("f-college").value.trim();
    if(!name || !roll){
      document.getElementById("start-err").textContent = "Please enter your name and roll number to begin.";
      return;
    }
    state.name = name; state.roll = roll; state.college = college;
    state.startTime = Date.now();
    state.screen = "test";
    state.currentIndex = 0;
    saveState();
    render();
    startTimer();
  };
}

function renderTest(app){
  const q = QUESTIONS[state.currentIndex];
  const answeredCount = Object.keys(state.answers).length;
  const isLast = state.currentIndex === QUESTIONS.length - 1;

  const ticks = QUESTIONS.map((qq,i) => {
    let cls = "progress-tick";
    if(state.answers[qq.id]) cls += " answered";
    if(i === state.currentIndex) cls += " current";
    return `<div class="${cls}"></div>`;
  }).join("");

  const optionsHtml = ["A","B","C","D"].map(letter => {
    const selected = state.answers[q.id] === letter;
    return `
      <div class="option${selected?' selected':''}" data-letter="${letter}">
        <div class="mark">${letter}</div>
        <div class="otext">${escapeHtml(q.options[letter])}</div>
      </div>`;
  }).join("");

  const paletteHtml = QUESTIONS.map((qq,i) => {
    let cls = "pcell";
    if(state.answers[qq.id]) cls += " answered";
    if(i === state.currentIndex) cls += " current";
    return `<div class="${cls}" data-jump="${i}">${qq.id}</div>`;
  }).join("");

  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><b>${escapeHtml(state.name)}</b> &middot; Roll ${escapeHtml(state.roll)}</div>
      <div class="timer mono" id="timer-display">--:--</div>
    </div>
    <div class="progress-track">${ticks}</div>
    <div class="card">
      <div class="section-label">${q.section}</div>
      <div class="qcount">Question ${state.currentIndex+1} of ${QUESTIONS.length} &middot; ${answeredCount} answered</div>
      <p class="qtext">${escapeHtml(q.text)}</p>
      <div class="options">${optionsHtml}</div>
      <div class="actions">
        <button class="btn ghost" id="prev-btn" ${state.currentIndex===0?'disabled':''}>Previous</button>
        <div class="right">
          ${isLast
            ? `<button class="btn" id="submit-btn">Submit Test</button>`
            : `<button class="btn" id="next-btn">Next</button>`}
        </div>
      </div>
      <div class="palette">${paletteHtml}</div>
    </div>
  `;

  app.querySelectorAll(".option").forEach(el => {
    el.onclick = () => {
      state.answers[q.id] = el.getAttribute("data-letter");
      saveState();
      renderTest(app);
    };
  });
  app.querySelectorAll("[data-jump]").forEach(el => {
    el.onclick = () => {
      state.currentIndex = parseInt(el.getAttribute("data-jump"),10);
      saveState();
      renderTest(app);
    };
  });
  const prevBtn = document.getElementById("prev-btn");
  if(prevBtn) prevBtn.onclick = () => {
    state.currentIndex = Math.max(0, state.currentIndex-1);
    saveState(); renderTest(app);
  };
  const nextBtn = document.getElementById("next-btn");
  if(nextBtn) nextBtn.onclick = () => {
    state.currentIndex = Math.min(QUESTIONS.length-1, state.currentIndex+1);
    saveState(); renderTest(app);
  };
  const submitBtn = document.getElementById("submit-btn");
  if(submitBtn) submitBtn.onclick = () => {
    const unanswered = QUESTIONS.length - Object.keys(state.answers).length;
    if(unanswered > 0){
      if(!confirm(unanswered + " question(s) are still unanswered. Submit anyway?")) return;
    }
    submitTest(false);
  };

  updateTimerDisplay();
}

function renderDone(app){
  app.innerHTML = `
    <div class="topbar"><div class="brand"><b>PCCPL</b> &middot; Campus Recruitment</div></div>
    <div class="card" style="text-align:center;">
      <div class="done-icon">&#9679;</div>
      <h1>Test submitted</h1>
      <p class="sub">Thank you, ${escapeHtml(state.name)}. Your responses for the GET &ndash; Operations screening test have been recorded.</p>
      <p class="hint">You may close this tab now. Results and next steps will be communicated by the placement/HR team.</p>
    </div>
  `;
}

function renderError(app){
  app.innerHTML = `
    <div class="topbar"><div class="brand"><b>PCCPL</b> &middot; Campus Recruitment</div></div>
    <div class="card" style="text-align:center;">
      <div class="done-icon">&#9888;</div>
      <h1>Submission did not go through</h1>
      <p class="sub">Your answers are still saved on this device. Please check your internet connection and retry, or inform the invigilator.</p>
      <button class="btn" id="retry-btn" style="margin-top:10px;">Retry Submission</button>
    </div>
  `;
  document.getElementById("retry-btn").onclick = () => submitTest(state.pendingAutoSubmit || false);
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ======================================================================
   TIMER
   ====================================================================== */
function startTimer(){
  if(timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(updateTimerDisplay, 1000);
  window.addEventListener("beforeunload", beforeUnloadHandler);
}

function beforeUnloadHandler(e){
  if(state.screen === "test"){ e.preventDefault(); e.returnValue = ""; }
}

function updateTimerDisplay(){
  if(state.screen !== "test" || !state.startTime) return;
  const endTime = state.startTime + TEST_DURATION_MIN*60*1000;
  const remainingMs = endTime - Date.now();
  const el = document.getElementById("timer-display");
  if(remainingMs <= 0){
    if(el) el.textContent = "00:00";
    clearInterval(timerHandle);
    submitTest(true);
    return;
  }
  const totalSec = Math.floor(remainingMs/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,"0");
  const ss = String(totalSec%60).padStart(2,"0");
  if(el){
    el.textContent = mm+":"+ss;
    el.className = "timer mono";
    if(totalSec <= 120) el.className += " danger";
    else if(totalSec <= 300) el.className += " warn";
  }
}

/* ======================================================================
   SUBMIT
   ====================================================================== */
let submitting = false;

async function submitTest(autoSubmitted){
  if(submitting) return;
  submitting = true;
  state.pendingAutoSubmit = autoSubmitted;

  const timeTakenSeconds = state.startTime ? Math.round((Date.now()-state.startTime)/1000) : "";
  const payload = {
    name: state.name,
    rollNumber: state.roll,
    college: state.college,
    answers: JSON.stringify(state.answers),
    timeTakenSeconds: String(timeTakenSeconds),
    autoSubmitted: String(!!autoSubmitted)
  };

  try{
    if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0){
      throw new Error("Backend URL not configured");
    }
    await fetch(APPS_SCRIPT_URL, {
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body: new URLSearchParams(payload)
    });
    state.submitted = true;
    state.screen = "done";
    submitting = false;
    window.removeEventListener("beforeunload", beforeUnloadHandler);
    if(timerHandle) clearInterval(timerHandle);
    saveState();
    render();
  }catch(err){
    submitting = false;
    state.screen = "error";
    saveState();
    render();
  }
}

/* ======================================================================
   INIT
   ====================================================================== */
render();
if(state.screen === "test") startTimer();
</script>
</body>
</html>
