# Paid exclusive content. Public catalog only: titles, prices and what is inside.
# The content itself is in Firestore (collection "items", id = id below) and opens only for buyers.
# Pages are made by tools/build_exclusive_pages.py from this file.
groups:
  - key: books
    title: 3D concept books
    blurb: Pencil-sketch equipment rises off the page. Turn it, change the flows and temperatures, and watch the physics respond. Each page ends with a quick check, and your progress is saved.
  - key: articles
    title: Detailed plant articles
    blurb: In-depth guides with full worked plant examples, for engineers who design, check and troubleshoot equipment.
  - key: concepts
    title: Concept notes
    blurb: Chapter-length notes on core chemical engineering concepts, with derivations kept short and every worked problem solved to the number. Useful for GATE, interviews and design work.
  - key: calculators
    title: Pro calculators
    blurb: Bigger design tools than the free calculators, each with a PDF report and an Excel version with live formulas.
  - key: templates
    title: Excel templates
    blurb: Ready-to-use workbooks for everyday plant engineering work.
  - key: excel
    title: Excel versions of the free calculators
    blurb: The same method as the free calculator, as an Excel workbook with live formulas you can keep, edit and attach to your calculations.

items:
  - id: art-shell-tube-hx-design
    slug: shell-and-tube-heat-exchanger-design
    group: books
    demo: hx
    title: "Shell-and-tube heat exchangers in 3D, with the full design guide"
    short: A 10-page interactive 3D book, from what is inside an exchanger to designing and troubleshooting one, plus the plant engineer's Kern-method design guide.
    price: 99
    what:
      - "Inside the exchanger: cut the shell away, follow both flows, add baffles and watch h and ΔP change"
      - "Co- vs counter-current with live temperature profiles, LMTD and the temperature cross"
      - "Two tube passes and the F factor, with your design on the F curve"
      - "Fouling and U: every resistance drawn to scale, so you see which one controls"
      - "TEMA types BEM, BEU and AES side by side: expansion, cleaning and cost"
      - "Triangular, square and rotated-square pitch: real tube counts for any shell"
      - "Bypass streams and sealing strips, with the Bell–Delaware bypass factor"
      - "A steam condenser: saturation temperature, condensate rate and the air blanket at the vent"
      - "A six-step design walk-through of a toluene cooler"
      - "Troubleshooting: three plant days, read the instruments and find the cause"
      - "Full notes: TEMA selection, Kern film coefficients, pressure drop, a worked example and a vendor-datasheet checklist"
    related: [/calculators/lmtd-calculator/, /calculators/overall-heat-transfer-coefficient-calculator/]
    promote: ["/calculators/lmtd-calculator/", "/calculators/overall-heat-transfer-coefficient-calculator/", "/articles/heat-exchanger-design-basics/", "/articles/heat-load-calculation/", "/calculators/heat-load-calculator/", "/equipment-instruments/"]
  - id: book-fluid-flow-3d
    slug: fluid-flow-3d-concept-book
    group: books
    demo: venturi
    title: "Fluid flow in 3D: from Bernoulli to pumps and water hammer"
    short: A 10-page interactive 3D book that makes pressure, friction, pumps and flowmeters visible, with live numbers on every page.
    price: 99
    what:
      - "Venturi with three piezometer tubes, the energy line and cavitation at the throat"
      - "Pump, tank and valve: pump curve, system curve and NPSH, with bubbles at the impeller eye"
      - "Reynolds' dye experiment, the velocity profile and the friction factor"
      - "Pipe friction and roughness on a live Moody chart"
      - "Fittings by the Crane method, with the pressure line stepping down at each valve"
      - "Orifice plate versus venturi: differential, permanent loss and the yearly pumping cost"
      - "Two pumps in series or in parallel against your system curve"
      - "Throttling valve versus VFD: affinity laws and the energy saved per year"
      - "Water hammer: close a valve and watch the pressure wave, with Joukowsky and 2L/a"
      - "Draining a tank: Torricelli, discharge coefficients and why the last half takes longest"
    related: [/calculators/pump-power-calculator/, /calculators/pipe-pressure-drop/]
    promote: ["/calculators/pump-power-calculator/", "/calculators/pipe-pressure-drop/", "/articles/pump-power-calculation/", "/articles/line-sizing-and-pressure-drop/", "/articles/pump-and-mechanical-seal-troubleshooting/"]
  - id: art-reactor-heat-scaleup
    slug: exothermic-reaction-scale-up-heat-removal-dosing
    group: articles
    title: "Scaling up an exothermic batch reaction: heat removal, U and dosing time"
    short: Turn RC1 and DSC results into a safe plant dosing time, with the measured U of your reactor and the MTSR.
    price: 49
    what:
      - Why heat removal per kg falls with scale, with numbers
      - Measuring the real U of a plant reactor with a simple cooling test
      - Building U from resistances, and why the glass lining dominates
      - Dosing-controlled semi-batch reactions, accumulation, MTSR and Stoessel classes
      - Worked example from RC1 data to a 6.3 kL glass-lined reactor
      - Traps that catch experienced teams, and a tech-transfer checklist
    related: [/calculators/reagent-addition-time-calculator/, /calculators/batch-cooling-tr-calculator/, /process-safety/stoessel-criticality-classes/]
    promote: ["/calculators/reagent-addition-time-calculator/", "/calculators/batch-cooling-tr-calculator/", "/process-safety/stoessel-criticality-classes/", "/process-safety/cooling-failure-and-runaway/", "/process-safety/scale-up-and-tech-transfer/", "/process-safety/thermal-testing-dsc-arc-rc/", "/articles/semi-batch-dosing-accumulation/", "/articles/how-to-read-dsc-arc-rc1-tsu/", "/process-modelling/semi-batch-dosing-simulator/", "/process-modelling/heating-cooling-time-simulator/", "/articles/jacket-and-limpet-coil-design/", "/calculators/jacketed-vessel-heat-transfer/", "/articles/lab-to-plant-scale-up-checklist/"]
  - id: con-vle-activity-models
    slug: vapour-liquid-equilibrium-activity-models
    group: concepts
    title: "Vapour–liquid equilibrium: from Raoult's law to activity-coefficient models"
    short: Bubble and dew calculations, non-ideal liquids, azeotropes and multicomponent flash, with five solved problems.
    price: 49
    what:
      - The equilibrium condition, K-values and relative volatility
      - Bubble and dew pressure and temperature, worked on benzene–toluene
      - Margules, van Laar, Wilson, NRTL and UNIFAC, and when to use each
      - Finding an azeotrope from activity coefficients
      - Rachford–Rice flash for three components
      - Practical pitfalls and practice questions with answers
    related: ["/solvents/azeotropes/", "/gate/practice/?sec=TD"]
    promote: ["/solvents/azeotropes/", "/articles/distillation-basics/", "/articles/solvent-recovery-calculation/"]
  - id: con-reactor-design-rtd
    slug: reactor-design-residence-time-distribution
    group: concepts
    title: "Reactor design: ideal reactors, multiple reactions and residence-time distribution"
