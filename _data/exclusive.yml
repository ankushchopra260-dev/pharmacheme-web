# Learning paths: a guided order through paid items and free tools. Progress is saved for signed-in buyers;
# finishing every paid step unlocks a certificate. Steps: item = paid item id, or free = page url (not tracked).
paths:
  - id: heat-transfer
    title: Heat exchangers for plant engineers
    blurb: From the LMTD to a rated shell-and-tube exchanger you can defend in a design review.
    steps:
      - { free: /calculators/lmtd-calculator/, title: "LMTD and F correction (free calculator)" }
      - { item: art-shell-tube-hx-design }
      - { free: /calculators/overall-heat-transfer-coefficient-calculator/, title: "Overall U (free calculator)" }
      - { item: xl-overall-heat-transfer-coefficient-calculator }
      - { item: pro-hx-rating }
  - id: fluid-flow
    title: Fluid flow and pumps
    blurb: See Bernoulli, cavitation and turbulence in 3D, then size real pumps and lines.
    steps:
      - { item: book-fluid-flow-3d }
      - { free: /calculators/pipe-pressure-drop/, title: "Pipe pressure drop and NPSH (free calculator)" }
      - { free: /calculators/pump-power-calculator/, title: "Pump power (free calculator)" }
      - { item: xl-pump-power-calculator }
  - id: reaction-safety
    title: Safe scale-up of exothermic reactions
    blurb: From calorimetry data to a plant dosing time, a cooling check and a HAZOP worksheet.
    steps:
      - { free: /process-safety/stoessel-criticality-classes/, title: "Stoessel criticality classes (free)" }
      - { item: art-reactor-heat-scaleup }
      - { item: xl-reagent-addition-time-calculator }
      - { item: xl-batch-cooling-tr-calculator }
      - { item: con-reactor-design-rtd }
