    slug: shell-tube-exchanger-rating-calculator
    group: calculators
    title: "Pro: shell-and-tube exchanger rating and sizing"
    short: Rate a shell-and-tube exchanger by the Kern method, or size the tube count for 20 % excess area. PDF report and Excel version included.
    price: 149
    what:
