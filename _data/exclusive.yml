    related: ["/gate/practice/?sec=RE", "/process-modelling/reaction-kinetics-fitting/"]
    promote: ["/process-modelling/reaction-kinetics-fitting/", "/articles/reactor-selection/", "/articles/continuous-flow-chemistry/"]
