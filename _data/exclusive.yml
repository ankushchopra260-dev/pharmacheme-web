# Paid exclusive content. Public catalog only: titles, prices and what is inside.
# The content itself is in Firestore (collection "items", id = id below) and opens only for buyers.
# Pages are made by tools/build_exclusive_pages.py from this file.
groups:
  - key: courses
    chip: Courses
    title: Self-paced courses
    blurb: Full courses you work through at your own pace. Interactive 3D lessons, plant assignments with self-checking Excel, worked solutions, a final test and a certificate.
  - key: books
    chip: 3D books
    title: 3D concept books
    blurb: Pencil-sketch equipment rises off the page. Turn it, change the flows and temperatures, and watch the physics respond. Each page ends with a quick check, and your progress is saved.
  - key: articles
    chip: Plant articles
    title: Detailed plant articles
    blurb: In-depth guides with full worked plant examples, for engineers who design, check and troubleshoot equipment.
  - key: concepts
    chip: Concept notes
    title: Concept notes
    blurb: Chapter-length notes on core chemical engineering concepts, with derivations kept short and every worked problem solved to the number. Useful for GATE, interviews and design work.
  - key: calculators
    chip: Pro calculators
    title: Pro calculators
    blurb: Bigger design tools than the free calculators, each with a PDF report and an Excel version with live formulas.
  - key: templates
    chip: Excel templates
    title: Excel templates
    blurb: Ready-to-use workbooks for everyday plant engineering work.
  - key: excel
    chip: Excel calculators
    title: Excel versions of the free calculators
    blurb: The same method as the free calculator, as an Excel workbook with live formulas you can keep, edit and attach to your calculations.
  - key: apps
    chip: Plant apps
    title: Plant planning apps
    blurb: Single-file apps that run in your browser with no install and no internet. Your data stays in the file on your computer.

items:
  - id: course-pe
    slug: process-engineering-course
    group: courses
    demo: reactor
    updated: "2026-11-03"
    meta: "Self-paced process engineering course for batch plants: 8 modules of interactive 3D lessons, self-checking Excel assignments, worked solutions and a certificate."
    title: "Process Engineering for Batch Plants (self-paced course)"
    short: "For final-year students, freshers and early-career engineers in API, agrochemical and specialty plants. Eight modules, each with three explained lessons and a guided 3D walk-through, a real plant assignment you work in a self-checking Excel workbook, a step-by-step worked solution and a quiz. Ends with a 24-question final test and a certificate. The First 30 Days book is included as pre-reading."
    price: 999
    what:
      - "Module 1, Balances and units: kilograms to moles with assay and equivalents, conversion and losses to a yield you can defend, and the unit traps (vacuum vs absolute, kcal vs kW, TR) that cost money. Assignment: a batch material balance with yield and wet cake"
      - "Module 2, Fluid flow and pumps: why pipe size matters (velocity, Reynolds number, friction); head and power; NPSH and cavitation. Assignment: size a transfer line and its pump"
      - "Module 3, Heat transfer: U and its resistances in a glass-lined wall; the LMTD; how long a batch takes to heat and cool. Assignment: heat a batch with steam, then cool it with cooling water"
      - "Module 4, Separations: boiling under vacuum; recovery time and condenser load; why the last filtrate takes the longest. Assignment: plan a vacuum solvent recovery"
      - "Module 5, Reactors: mixing scale-up from lab to plant; heat of reaction and the shortest safe dosing time; accumulation and the MTSR. Assignment: scale the agitation, then set a safe dosing time"
      - "Module 6, Process safety: a HAZOP node, deviation by deviation; inerting by pressure or vacuum purge; layers of protection (LOPA). Assignment: inert a reactor before a flammable charge"
      - "Module 7, Debottlenecking: where the hours go (equipment occupancy); the bottleneck of an equipment train; fixed cost and cost per kg. Assignment: find the bottleneck and cost the fix"
      - "Module 8, Capstone: one batch end to end, from the balance to the monthly output, and reviewing a calculation like a senior engineer"
      - "Every assignment has a worked solution, step by step with units, plus a four-question quiz"
      - "Assignment workbook (Excel): one sheet per module; type your answers and each one shows ✓ or ✗ against the key"
      - "Formula sheet: every formula in the course on one page"
      - "Final test: 24 questions, pass at 70 %, unlimited retakes, score by module, certificate with your name and an ID"
      - "Included: The First 30 Days in a Chemical Plant, as pre-reading"
    related: [/process-engineering-training/, /calculators/pipe-pressure-drop/, /calculators/lmtd-calculator/, /calculators/mixing-scale-up-calculator/, /articles/hazop-made-practical/, /articles/batch-cycle-time-debottlenecking/]
