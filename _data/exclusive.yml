      - Pressure drop on both sides, with warnings for velocity, F and margin
      - One-click sizing for 20 % excess area
      - PDF report and an Excel version with live formulas
    related: [/calculators/lmtd-calculator/, /calculators/overall-heat-transfer-coefficient-calculator/]
    promote: ["/calculators/lmtd-calculator/", "/calculators/overall-heat-transfer-coefficient-calculator/", "/articles/heat-exchanger-design-basics/", "/articles/steam-energy-and-condenser-selection/", "/equipment-instruments/"]
