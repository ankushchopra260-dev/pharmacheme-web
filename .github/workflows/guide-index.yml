name: Rebuild plant guide search
on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/data/site-search.json'
      - 'assets/data/solvent-facts.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: guide-index
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 tools/build_guide_index.py
      - name: Commit if the search data changed
        run: |
          if git diff --quiet -- assets/data; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/data/site-search.json assets/data/solvent-facts.json
          git commit -m "Rebuild plant guide search data"
          git push
