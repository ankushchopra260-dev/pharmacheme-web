title: PharmaChemE
description: "Engineering calculators, troubleshooting games, a molecule tool and articles for chemical and pharma plant engineers and students."
url: "https://www.pharmacheme.in"
baseurl: ""

markdown: kramdown
plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - tools

collections:
  articles:
    output: true
    permalink: /articles/:name/

defaults:
  - scope:
      path: "PCCPL-LALRU"
    values:
      sitemap: false
  - scope:
      path: "get-test"
    values:
      sitemap: false
  - scope:
      path: "admin"
    values:
      sitemap: false
  - scope:
      type: articles
    values:
      layout: article
      breadcrumbs:
        - label: Articles
          url: /articles/
  - scope:
      path: "admin"
    values:
      sitemap: false
