---
layout: default
title: "Sales admin"
noindex: true
sitemap: false
guide: false
---
<link rel="stylesheet" href="{{ '/assets/css/gate.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<style>
  .ad { max-width: 980px; }
  .ad section { background: var(--panel); border: 1px solid var(--grid-line); border-radius: 10px; padding: 16px 18px; margin: 0 0 18px; color: var(--paper); }
  .ad h2 { font: 700 1.1rem var(--f-display); color: var(--brass); margin: 0 0 10px; }
  .ad table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .ad th, .ad td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--grid-line); vertical-align: middle; }
  .ad th { color: var(--muted); font-size: .74rem; font-weight: 600; }
  .ad td.e { word-break: break-all; }
  .ad .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .ad input[type=text], .ad input[type=email], .ad input[type=date], .ad textarea { background: #0e1d2c; color: var(--paper); border: 1px solid #2C4C6C; border-radius: 6px; padding: 7px 9px; font: inherit; font-size: .88rem; }
  .ad textarea { width: 100%; min-height: 110px; }
  .ad .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .ad .ts-btn { padding: 6px 11px; font-size: .82rem; }
  .ad .msg { min-height: 1.2em; font-size: .88rem; color: var(--brass); }
  .ad .mute { color: var(--muted); font-size: .85rem; }
  .ad .sent { display: inline-block; margin-top: 6px; font-size: .82rem; color: #8fd3a3; } .ad .sent::before { content: "✓ "; }
  .ad .row label { min-width: 70px; color: var(--paper); font-size: .9rem; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: min(560px, calc(100vw - 32px)); background: #FDBE53; color: #0B1622; font-weight: 600; font-size: .9rem; padding: 12px 16px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.4); z-index: 9999; }
  @media (max-width: 700px) { .ad table, .ad tbody, .ad tr, .ad td { display: block; } .ad thead { display: none; } .ad tr { border-bottom: 1px solid var(--grid-line); padding: 6px 0; } .ad td { border: 0; padding: 3px 0; } }
</style>

<div class="container gt-head"><h1>Sales admin</h1><p>Requests, access and content uploads for the GATE CH test series and all exclusive content. Only the owner's Google account can use this page.</p></div>
<div class="container ad" id="ad"><p class="mute">Loading…</p></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js';
import { getFirestore, doc, getDocs, setDoc, updateDoc, deleteDoc, deleteField, collection, serverTimestamp, Timestamp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js';

const app = initializeApp({ apiKey: 'AIzaSyAoko-Lgtl23DrJQ5_Dk3bQpdCHX0NvMCc', authDomain: 'pharmacheme-1f559.firebaseapp.com', projectId: 'pharmacheme-1f559', storageBucket: 'pharmacheme-1f559.firebasestorage.app', messagingSenderId: '324335799446', appId: '1:324335799446:web:a7bb53bbc3e4b67c9906b7' });
const auth = getAuth(app), db = getFirestore(app), root = document.getElementById('ad');
const SITE = 'https://www.pharmacheme.in';
// everything that can be sold: the GATE test series plus the exclusive catalog (_data/exclusive.yml)
const CAT = {{ site.data.exclusive.items | jsonify }};
const PRODUCTS = [{ id: 'gate-test-series', title: 'GATE CH test series', price: '₹199', url: '/gate/test-series/', until: '2027-03-31', gate: true }]
  .concat(CAT.map(c => ({ id: c.id, title: c.title, price: '₹' + c.price, url: '/exclusive/' + c.slug + '/', until: '2099-12-31' })));
const P = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = d => !d ? '' : d.getFullYear() >= 2099 ? 'Lifetime' : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
const key = e => e.trim().toLowerCase();
const ls = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* blocked */ } } };
const TPL_PAY = 'Hello {name},\n\nThank you for your interest in {title} from PharmaChemE.\n\nPlease pay {price} by UPI to: {upi}\n\nAfter paying, reply to this email with the UPI transaction reference. We will switch on access for {email} and it will open at {url}\n\nRegards,\nPharmaChemE';
const TPL_OK = 'Hello {name},\n\nWe have received your payment. {title} is now open for you{until}.\n\nOpen {url} and sign in with {email}.\n\nThank you,\nPharmaChemE';
const fill = (t, v) => t.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
const FROM = 'pharmacheme.app@gmail.com';
const gmail = (to, subject, body) => 'https://mail.google.com/mail/u/' + encodeURIComponent(FROM) + '/?view=cm&fs=1&to=' + encodeURIComponent(to) + '&su=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
const NOTIFY = {{ site.notify_url | jsonify }};
let MAILKEY = '';
// Send through the PharmaChemE mail web app (from pharmacheme.app@gmail.com, BCC to the owner). Falls back to Gmail compose.
async function postMail(to, subject, body) {
  if (!MAILKEY || !NOTIFY) { sendMail(to, subject, body); return { ok: false, fallback: true, error: MAILKEY ? 'no mail web app' : 'mail key not saved' }; }
  try {
    const r = await fetch(NOTIFY, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'mail', key: MAILKEY, to, subject, body }) });
    const j = await r.json(); if (j && j.ok) return j; throw new Error((j && j.error) || 'not sent');
  } catch (e) { toast('Automatic email failed (' + e.message + '). Opening Gmail instead.'); sendMail(to, subject, body); return { ok: false, fallback: true, error: e.message }; }
}
function sendMail(to, subject, body, pre) {
  let w = pre || null;
  if (w && !w.closed) w.location.href = gmail(to, subject, body); else w = window.open(gmail(to, subject, body), '_blank');
  try { navigator.clipboard.writeText(body).catch(() => {}); } catch (e) { /* clipboard blocked */ }
  toast(w ? 'Gmail opened in a new tab, signed in as ' + FROM + '. Check it and press Send. (The message is also copied, in case you want to paste it elsewhere.)' : 'Your browser blocked the new tab. Allow pop-ups for this site, or paste the copied message into an email to ' + to + '.');
}
function toast(t) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => { el.hidden = true; }, 9000); }
const prodOpts = sel => PRODUCTS.map(p => '<option value="' + p.id + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.title) + ' (' + esc(p.price) + ')</option>').join('');

function signedOut() { root.innerHTML = '<section><p>Sign in with the owner\'s Google account.</p><button class="ts-btn prim" id="in">Sign in with Google</button></section>'; document.getElementById('in').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()); }

async function load(user) {
  root.innerHTML = '<p class="mute">Loading…</p>';
  let reqs, acc, mocks, items;
  try {
    [reqs, acc, mocks, items] = await Promise.all([getDocs(collection(db, 'requests')), getDocs(collection(db, 'access')), getDocs(collection(db, 'mocks')), getDocs(collection(db, 'items'))]);
  } catch (e) {
    root.innerHTML = '<section><p>' + esc(user.email) + ' cannot open the admin data (' + esc(e.code || e.message) + '). Check that this email is listed as an admin in the Firestore rules, and that the latest rules are published.</p><button class="ts-btn" id="out">Sign out</button></section>';
    document.getElementById('out').onclick = () => signOut(auth); return;
  }
  const R = reqs.docs.map(d => { const v = d.data(); return { id: d.id, ...v, pid: v.item || 'gate-test-series' }; }).sort((a, b) => (b.at?.seconds || 0) - (a.at?.seconds || 0));
  const cfgDoc = acc.docs.find(d => d.id === '_config');
  const rows = []; // one row per (person, product)
  acc.docs.filter(d => d.id !== '_config').forEach(d => { const a = d.data();
    if (a.until) rows.push({ id: d.id, email: a.email || d.id, name: a.name, pid: 'gate-test-series', until: a.until.toDate() });
    Object.entries(a.items || {}).forEach(([pid, t]) => rows.push({ id: d.id, email: a.email || d.id, name: a.name, pid, until: t.toDate ? t.toDate() : null })); });
  rows.sort((a, b) => a.email.localeCompare(b.email) || a.pid.localeCompare(b.pid));
  const people = new Set(rows.map(r => r.id)).size;
  const M = mocks.docs.map(d => d.id).sort(), IT = items.docs.map(d => d.id).sort();
  const cfg = (cfgDoc && cfgDoc.data()) || {}, upi = cfg.upi || ls.get('ts-upi', ''), now = new Date(), MAILED = cfg.mailed || {}; MAILKEY = cfg.mailKey || '';
  const sentNote = rid => { const t = MAILED[rid]; return t && t.toDate ? '<span class="sent">UPI email sent ' + esc(t.toDate().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) + '</span>' : '<span class="mute">UPI email not sent yet</span>'; };
  const pname = pid => P[pid] ? P[pid].title : pid;
  root.innerHTML =
    '<p class="mute">Signed in as ' + esc(user.email) + ' · <button class="ts-link" id="out">Sign out</button></p>' +
    '<section><h2>Settings</h2><div class="row"><label for="upi">UPI ID</label><input type="text" id="upi" placeholder="yourname@bank" value="' + esc(upi) + '" size="28"><button class="ts-btn" id="upi-save">Save</button></div><div class="row"><label for="mkey">Mail key</label><input type="password" id="mkey" placeholder="from the mail web app" value="' + esc(MAILKEY) + '" size="28" autocomplete="off"><button class="ts-btn" id="mkey-save">Save</button><span class="mute">' + (MAILKEY ? 'Emails go out automatically from pharmacheme.app@gmail.com, with a BCC to your personal Gmail.' : 'Without the key, emails open in Gmail for you to send.') + '</span></div></section>' +
    '<section><h2>Requests waiting (' + R.length + ')</h2>' + (R.length ? '<table><thead><tr><th>Email</th><th>Item</th><th>Requested</th><th>Access until</th><th></th></tr></thead><tbody>' + R.map((r, i) =>
      '<tr><td class="e">' + esc(r.email) + '<br><span class="mute">' + esc(r.name) + '</span></td><td>' + esc(pname(r.pid)) + '<br><span class="mute">' + esc(P[r.pid] ? P[r.pid].price : r.price || '') + '</span></td><td>' + esc(fmt(r.at?.toDate?.())) + '</td><td><input type="date" value="' + (P[r.pid] ? P[r.pid].until : '2099-12-31') + '" data-u="' + i + '"></td><td><div class="btns"><a class="ts-btn" data-pay="' + i + '" href="#">' + (MAILED[r.id] ? 'Send UPI email again' : 'Email UPI ID') + '</a><button class="ts-btn prim" data-grant="' + i + '">Payment received: grant</button><button class="ts-btn" data-del="' + i + '">Remove</button></div>' + sentNote(r.id) + '</td></tr>').join('') + '</tbody></table>' : '<p class="mute">No pending requests.</p>') + '</section>' +
    '<section><h2>Give access directly</h2><div class="row"><input type="email" id="new-e" placeholder="student@gmail.com" size="26"><input type="text" id="new-n" placeholder="Name (optional)"><select id="new-p">' + prodOpts('gate-test-series') + '</select><input type="date" id="new-u" value="2027-03-31"><button class="ts-btn prim" id="new-go">Grant</button></div><p class="mute">Use the exact Google email the person signs in with. 31-12-2099 means lifetime.</p></section>' +
    '<section><h2>Access given (' + rows.length + ' items, ' + people + ' people)</h2>' + (rows.length ? '<table><thead><tr><th>Email</th><th>Item</th><th>Until</th><th>Status</th><th></th></tr></thead><tbody>' + rows.map((a, i) =>
      '<tr><td class="e">' + esc(a.email) + '<br><span class="mute">' + esc(a.name) + '</span></td><td>' + esc(pname(a.pid)) + '</td><td>' + esc(fmt(a.until)) + '</td><td>' + (a.until && a.until > now ? 'Active' : 'Ended') + '</td><td><div class="btns"><input type="date" value="' + (a.until ? a.until.toISOString().slice(0, 10) : '2099-12-31') + '" data-au="' + i + '"><button class="ts-btn" data-ext="' + i + '">Change date</button><button class="ts-btn" data-rev="' + i + '">Revoke</button></div></td></tr>').join('') + '</tbody></table>' : '<p class="mute">Nobody yet.</p>') + '</section>' +
    '<section><h2>Content in the database</h2><p class="mute">GATE mocks (' + M.length + '/10): ' + (M.join(', ') || 'none') + '</p><p class="mute">Exclusive items (' + IT.length + '/' + CAT.length + '): ' + (IT.length ? IT.length === CAT.length ? 'all uploaded' : 'missing ' + CAT.filter(c => !IT.includes(c.id)).map(c => c.id).join(', ') : 'none') + '</p>' +
    '<div class="row"><input type="file" id="files" accept=".json,application/json" multiple><button class="ts-btn prim" id="up">Upload</button></div><p class="mute">Choose m01.json … m10.json (private repo, gate/dist) and/or exclusive.json (private repo, exclusive/dist). Uploading again replaces what is there.</p><p class="msg" id="up-msg"></p></section>';
  const $ = id => document.getElementById(id);
  $('out').onclick = () => signOut(auth);
  $('upi-save').onclick = async () => { const v = $('upi').value.trim(); ls.set('ts-upi', v);
    try { await setDoc(doc(db, 'access', '_config'), { upi: v }, { merge: true }); toast('UPI ID saved.'); } catch (e) { toast('Saved in this browser only (' + (e.code || e.message) + ').'); } };
  $('mkey-save').onclick = async () => { const v = $('mkey').value.trim(); try { await setDoc(doc(db, 'access', '_config'), { mailKey: v }, { merge: true }); MAILKEY = v; toast(v ? 'Mail key saved. Emails will now be sent automatically.' : 'Mail key removed.'); } catch (e) { toast('Could not save (' + (e.code || e.message) + ').'); } };
  const markSent = async rids => { const m = {}; rids.forEach(id => { m[id] = serverTimestamp(); }); try { await setDoc(doc(db, 'access', '_config'), { mailed: m }, { merge: true }); } catch (e) { /* log only */ } };
  $('new-p').onchange = e => { $('new-u').value = (P[e.target.value] || {}).until || '2099-12-31'; };
  const grant = async (email, name, pid, untilStr) => {
    const until = new Date(untilStr + 'T23:59:59+05:30'), ref = doc(db, 'access', key(email)), base = { email: key(email), name: name || '', granted: serverTimestamp() };
    if (P[pid] && P[pid].gate) await setDoc(ref, Object.assign(base, { until: Timestamp.fromDate(until) }), { merge: true });
    else await setDoc(ref, Object.assign(base, { items: { [pid]: Timestamp.fromDate(until) } }), { merge: true });
    try { await deleteDoc(doc(db, 'requests', P[pid] && P[pid].gate ? key(email) : key(email) + '__' + pid)); } catch (e) { /* no request */ }
    return until;
  };
  const mailVars = (r, extra) => Object.assign({ name: r.name || 'there', email: r.email, title: pname(r.pid), price: P[r.pid] ? P[r.pid].price : r.price || '', url: SITE + (P[r.pid] ? P[r.pid].url : '/exclusive/') }, extra);
  root.querySelectorAll('[data-pay]').forEach(a => { const r = R[+a.dataset.pay];
    a.onclick = async e => { e.preventDefault(); const u = $('upi').value.trim(); if (!u) { toast('Type your UPI ID in the box at the top and press Save first.'); $('upi').focus(); $('upi').scrollIntoView({ block: 'center' }); return; }
      const same = R.filter(x => x.email === r.email);
      let rids = [r.id], subj, body;
      if (same.length > 1 && confirm(r.email + ' has requested ' + same.length + ' items. Send one email with the total for all of them?')) {
        const tot = same.reduce((s, x) => s + (parseInt(String((P[x.pid] || {}).price || x.price || '0').replace(/\D/g, ''), 10) || 0), 0);
        rids = same.map(x => x.id); subj = 'PharmaChemE: payment details for ' + same.length + ' items';
        body = fill(TPL_PAY, mailVars(r, { title: same.map(x => '\n  - ' + pname(x.pid) + ' (' + ((P[x.pid] || {}).price || '') + ')').join('') + '\n', price: '₹' + tot, upi: u, url: SITE + '/exclusive/' }));
      } else { subj = 'PharmaChemE ' + pname(r.pid) + ': payment details'; body = fill(TPL_PAY, mailVars(r, { upi: u })); }
      if (MAILED[r.id] && !confirm('A UPI email already went to ' + r.email + ' on ' + MAILED[r.id].toDate().toLocaleString('en-IN') + '. Send it again?')) return;
      a.textContent = 'Sending…';
      const res = await postMail(r.email, subj, body);
      if (res.ok) { await markSent(rids); toast('Sent to ' + r.email + ' from pharmacheme.app@gmail.com. A copy is in your personal Gmail (BCC).'); load(user); }
      else a.textContent = 'Email UPI ID';
    }; });
  root.querySelectorAll('[data-grant]').forEach(b => b.onclick = async () => { const i = +b.dataset.grant, r = R[i], ustr = root.querySelector('[data-u="' + i + '"]').value || '2099-12-31';
    if (!confirm('Grant ' + pname(r.pid) + ' to ' + r.email + (ustr >= '2099' ? ' for life' : ' until ' + ustr) + '?\n\nA confirmation email will be sent to them.')) return; b.disabled = true;
    try { const until = await grant(r.email, r.name, r.pid, ustr);
      const res = await postMail(r.email, 'Your PharmaChemE access is active: ' + pname(r.pid), fill(TPL_OK, mailVars(r, { until: until.getFullYear() >= 2099 ? '' : ' until ' + fmt(until) })));
      toast(res.ok ? 'Access given and confirmation sent to ' + r.email + '.' : 'Access given. Send the confirmation from the Gmail tab.'); setTimeout(() => load(user), 600); }
    catch (e) { b.disabled = false; toast('Could not grant: ' + (e.code || e.message)); } });
  root.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { const r = R[+b.dataset.del]; if (!confirm('Remove the request from ' + r.email + '?')) return; await deleteDoc(doc(db, 'requests', r.id)); load(user); });
  $('new-go').onclick = async () => { const e = $('new-e').value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { toast('Enter a valid email.'); return; }
    try { await grant(e, $('new-n').value.trim(), $('new-p').value, $('new-u').value || '2099-12-31'); toast('Access given.'); load(user); } catch (er) { toast('Could not grant: ' + (er.code || er.message)); } };
  root.querySelectorAll('[data-ext]').forEach(b => b.onclick = async () => { const i = +b.dataset.ext, a = rows[i], ustr = root.querySelector('[data-au="' + i + '"]').value; if (!ustr) return;
    const ts = Timestamp.fromDate(new Date(ustr + 'T23:59:59+05:30'));
    await updateDoc(doc(db, 'access', a.id), P[a.pid] && P[a.pid].gate ? { until: ts } : { ['items.' + a.pid]: ts }); load(user); });
  root.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => { const a = rows[+b.dataset.rev]; if (!confirm('Revoke ' + pname(a.pid) + ' for ' + a.email + '?')) return;
    await updateDoc(doc(db, 'access', a.id), P[a.pid] && P[a.pid].gate ? { until: deleteField() } : { ['items.' + a.pid]: deleteField() }); load(user); });
  $('up').onclick = async () => { const files = Array.from($('files').files || []), out = $('up-msg'); if (!files.length) { out.textContent = 'Choose the files first.'; return; }
    const done = [];
    for (const f of files) {
      try { const data = JSON.parse(await f.text());
        if (Array.isArray(data.items)) {
          for (const it of data.items) { if (!it.id) continue; const { id, ...rest } = it; await setDoc(doc(db, 'items', id), Object.assign(rest, { updated: serverTimestamp() })); done.push(id); out.textContent = 'Uploaded ' + done.length + ' items…'; }
          continue; }
        const id = data.mock || f.name.replace(/\.json$/, ''), qs = data.questions;
        if (!/^m\d\d$/.test(id) || !Array.isArray(qs) || qs.length !== 65) throw new Error('not a mock file or an exclusive.json bundle');
        await setDoc(doc(db, 'mocks', id), { title: 'Mock ' + parseInt(id.slice(1), 10), questions: qs, updated: serverTimestamp() }); done.push(id); out.textContent = 'Uploaded ' + done.join(', ') + '…'; }
      catch (e) { out.textContent = f.name + ': ' + (e.code || e.message); return; } }
    out.textContent = 'Uploaded ' + done.length + ' (' + done.join(', ') + ').'; setTimeout(() => load(user), 800); };
}

onAuthStateChanged(auth, u => u ? load(u) : signedOut());
</script>
