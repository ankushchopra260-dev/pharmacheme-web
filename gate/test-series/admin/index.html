---
layout: default
title: "Test series admin"
noindex: true
sitemap: false
guide: false
---
<link rel="stylesheet" href="{{ '/assets/css/gate.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<style>
  .ad { max-width: 980px; }
  .ad section { background: var(--panel); border: 1px solid var(--grid-line); border-radius: 10px; padding: 16px 18px; margin: 0 0 18px; color: var(--paper); }
  .ad h2 { font: 700 1.1rem var(--f-display); color: var(--brass); margin: 0 0 10px; }
  .ad table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .ad th, .ad td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--grid-line); vertical-align: middle; }
  .ad th { color: var(--muted); font-size: .74rem; font-weight: 600; }
  .ad td.e { word-break: break-all; }
  .ad .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .ad input[type=text], .ad input[type=email], .ad input[type=date], .ad textarea { background: #0e1d2c; color: var(--paper); border: 1px solid #2C4C6C; border-radius: 6px; padding: 7px 9px; font: inherit; font-size: .88rem; }
  .ad textarea { width: 100%; min-height: 110px; }
  .ad .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .ad .ts-btn { padding: 6px 11px; font-size: .82rem; }
  .ad .msg { min-height: 1.2em; font-size: .88rem; color: var(--brass); }
  .ad .mute { color: var(--muted); font-size: .85rem; }
  @media (max-width: 700px) { .ad table, .ad tbody, .ad tr, .ad td { display: block; } .ad thead { display: none; } .ad tr { border-bottom: 1px solid var(--grid-line); padding: 6px 0; } .ad td { border: 0; padding: 3px 0; } }
</style>

<div class="container gt-head"><h1>Test series admin</h1><p>Requests, access and mock uploads for the GATE CH test series. Only the owner's Google account can use this page.</p></div>
<div class="container ad" id="ad"><p class="mute">Loading…</p></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js';
import { getFirestore, doc, getDocs, setDoc, deleteDoc, collection, serverTimestamp, Timestamp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js';

const app = initializeApp({ apiKey: 'AIzaSyAoko-Lgtl23DrJQ5_Dk3bQpdCHX0NvMCc', authDomain: 'pharmacheme-1f559.firebaseapp.com', projectId: 'pharmacheme-1f559', storageBucket: 'pharmacheme-1f559.firebasestorage.app', messagingSenderId: '324335799446', appId: '1:324335799446:web:a7bb53bbc3e4b67c9906b7' });
const auth = getAuth(app), db = getFirestore(app), root = document.getElementById('ad');
const DEFAULT_UNTIL = '2027-03-31', PRICE = '₹199';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = d => d ? d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const key = e => e.trim().toLowerCase();
const ls = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* blocked */ } } };
const TPL_PAY = 'Hello {name},\n\nThank you for your interest in the PharmaChemE GATE CH test series.\n\nPlease pay {price} by UPI to: {upi}\n\nAfter paying, reply to this email with the UPI transaction reference. We will switch on access for {email} and the 10 mocks will open at https://www.pharmacheme.in/gate/test-series/\n\nRegards,\nPharmaChemE';
const TPL_OK = 'Hello {name},\n\nWe have received your payment. Your access to the PharmaChemE GATE CH test series is now active until {until}.\n\nOpen https://www.pharmacheme.in/gate/test-series/ and sign in with {email} to start.\n\nAll the best for GATE!\nPharmaChemE';
const fill = (t, v) => t.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
const mailto = (to, subject, body) => 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);

function signedOut() { root.innerHTML = '<section><p>Sign in with the owner\'s Google account.</p><button class="ts-btn prim" id="in">Sign in with Google</button></section>'; document.getElementById('in').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()); }

async function load(user) {
  root.innerHTML = '<p class="mute">Loading…</p>';
  let reqs, acc, mocks;
  try {
    [reqs, acc, mocks] = await Promise.all([getDocs(collection(db, 'requests')), getDocs(collection(db, 'access')), getDocs(collection(db, 'mocks'))]);
  } catch (e) {
    root.innerHTML = '<section><p>' + esc(user.email) + ' cannot open the admin data (' + esc(e.code || e.message) + '). Check that this email is listed as an admin in the Firestore rules.</p><button class="ts-btn" id="out">Sign out</button></section>';
    document.getElementById('out').onclick = () => signOut(auth); return;
  }
  const R = reqs.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.at?.seconds || 0) - (a.at?.seconds || 0));
  const A = acc.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id.localeCompare(b.id));
  const M = mocks.docs.map(d => ({ id: d.id, n: (d.data().questions || []).length, title: d.data().title })).sort((a, b) => a.id.localeCompare(b.id));
  const upi = ls.get('ts-upi', '');
  const now = new Date();
  root.innerHTML =
    '<p class="mute">Signed in as ' + esc(user.email) + ' · <button class="ts-link" id="out">Sign out</button></p>' +
    '<section><h2>Your UPI ID</h2><div class="row"><input type="text" id="upi" placeholder="yourname@bank" value="' + esc(upi) + '" size="28"><button class="ts-btn" id="upi-save">Save</button><span class="mute">Kept in this browser only. Used in the reply emails.</span></div></section>' +
    '<section><h2>Requests waiting (' + R.length + ')</h2>' + (R.length ? '<table><thead><tr><th>Email</th><th>Name</th><th>Requested</th><th>Access until</th><th></th></tr></thead><tbody>' + R.map((r, i) =>
      '<tr><td class="e">' + esc(r.email) + '</td><td>' + esc(r.name) + '</td><td>' + esc(fmt(r.at?.toDate?.())) + '</td><td><input type="date" value="' + DEFAULT_UNTIL + '" data-u="' + i + '"></td><td><div class="btns"><a class="ts-btn" data-pay="' + i + '" href="#">Email UPI ID</a><button class="ts-btn prim" data-grant="' + i + '">Payment received: grant</button><button class="ts-btn" data-del="' + i + '">Remove</button></div></td></tr>').join('') + '</tbody></table>' : '<p class="mute">No pending requests.</p>') + '</section>' +
    '<section><h2>Give access directly</h2><div class="row"><input type="email" id="new-e" placeholder="student@gmail.com" size="28"><input type="text" id="new-n" placeholder="Name (optional)"><input type="date" id="new-u" value="' + DEFAULT_UNTIL + '"><button class="ts-btn prim" id="new-go">Grant</button></div><p class="mute">Use the exact Google email the student signs in with.</p></section>' +
    '<section><h2>People with access (' + A.length + ')</h2>' + (A.length ? '<table><thead><tr><th>Email</th><th>Name</th><th>Until</th><th>Status</th><th></th></tr></thead><tbody>' + A.map((a, i) => { const u = a.until?.toDate?.();
      return '<tr><td class="e">' + esc(a.email || a.id) + '</td><td>' + esc(a.name) + '</td><td>' + esc(fmt(u)) + '</td><td>' + (u && u > now ? 'Active' : 'Ended') + '</td><td><div class="btns"><input type="date" value="' + (u ? u.toISOString().slice(0, 10) : DEFAULT_UNTIL) + '" data-au="' + i + '"><button class="ts-btn" data-ext="' + i + '">Change date</button><button class="ts-btn" data-rev="' + i + '">Revoke</button></div></td></tr>'; }).join('') + '</tbody></table>' : '<p class="mute">Nobody yet.</p>') + '</section>' +
    '<section><h2>Mocks in the database (' + M.length + ')</h2>' + (M.length ? '<p class="mute">' + M.map(m => esc(m.id) + ' (' + m.n + ' questions)').join(', ') + '</p>' : '<p class="mute">None uploaded yet.</p>') +
    '<div class="row"><input type="file" id="files" accept=".json,application/json" multiple><button class="ts-btn prim" id="up">Upload</button></div><p class="mute">Choose the files m01.json … m10.json from the private repo (gate/dist). Uploading a file again replaces that mock.</p><p class="msg" id="up-msg"></p></section>' +
    '<p class="msg" id="msg"></p>';
  const $ = id => document.getElementById(id), msg = t => { $('msg').textContent = t; };
  $('out').onclick = () => signOut(auth);
  $('upi-save').onclick = () => { ls.set('ts-upi', $('upi').value.trim()); msg('UPI ID saved in this browser.'); };
  const grant = async (email, name, untilStr) => {
    const until = new Date(untilStr + 'T23:59:59+05:30');
    await setDoc(doc(db, 'access', key(email)), { email: key(email), name: name || '', until: Timestamp.fromDate(until), granted: serverTimestamp() });
    try { await deleteDoc(doc(db, 'requests', key(email))); } catch (e) { /* no request */ }
    return until;
  };
  root.querySelectorAll('[data-pay]').forEach(a => { const r = R[+a.dataset.pay];
    a.onclick = e => { const u = $('upi').value.trim(); if (!u) { e.preventDefault(); msg('Enter and save your UPI ID first.'); return; }
      a.href = mailto(r.email, 'PharmaChemE GATE CH test series: payment details', fill(TPL_PAY, { name: r.name || 'there', price: PRICE, upi: u, email: r.email })); }; });
  root.querySelectorAll('[data-grant]').forEach(b => b.onclick = async () => { const i = +b.dataset.grant, r = R[i], ustr = root.querySelector('[data-u="' + i + '"]').value || DEFAULT_UNTIL;
    if (!confirm('Grant access to ' + r.email + ' until ' + ustr + '?')) return; b.disabled = true;
    try { const until = await grant(r.email, r.name, ustr); location.href = mailto(r.email, 'Your GATE CH test series access is active', fill(TPL_OK, { name: r.name || 'there', until: fmt(until), email: r.email })); setTimeout(() => load(user), 600); }
    catch (e) { b.disabled = false; msg('Could not grant: ' + (e.code || e.message)); } });
  root.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { const r = R[+b.dataset.del]; if (!confirm('Remove the request from ' + r.email + '?')) return; await deleteDoc(doc(db, 'requests', r.id)); load(user); });
  $('new-go').onclick = async () => { const e = $('new-e').value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { msg('Enter a valid email.'); return; }
    try { await grant(e, $('new-n').value.trim(), $('new-u').value || DEFAULT_UNTIL); load(user); } catch (er) { msg('Could not grant: ' + (er.code || er.message)); } };
  root.querySelectorAll('[data-ext]').forEach(b => b.onclick = async () => { const i = +b.dataset.ext, a = A[i], ustr = root.querySelector('[data-au="' + i + '"]').value;
    if (!ustr) return; await setDoc(doc(db, 'access', a.id), { until: Timestamp.fromDate(new Date(ustr + 'T23:59:59+05:30')) }, { merge: true }); load(user); });
  root.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => { const a = A[+b.dataset.rev]; if (!confirm('Revoke access for ' + (a.email || a.id) + '?')) return; await deleteDoc(doc(db, 'access', a.id)); load(user); });
  $('up').onclick = async () => { const files = Array.from($('files').files || []), out = $('up-msg'); if (!files.length) { out.textContent = 'Choose the mock files first.'; return; }
    const done = [];
    for (const f of files) {
      try { const data = JSON.parse(await f.text()), id = data.mock || f.name.replace(/\.json$/, ''), qs = data.questions;
        if (!/^m\d\d$/.test(id) || !Array.isArray(qs) || qs.length !== 65) throw new Error('not a mock file (needs "mock": "mXX" and 65 questions)');
        await setDoc(doc(db, 'mocks', id), { title: 'Mock ' + parseInt(id.slice(1), 10), questions: qs, updated: serverTimestamp() });
        done.push(id); out.textContent = 'Uploaded ' + done.join(', ') + '…'; }
      catch (e) { out.textContent = f.name + ': ' + (e.code || e.message); return; } }
    out.textContent = 'Uploaded ' + done.join(', ') + '.'; setTimeout(() => load(user), 800); };
}

onAuthStateChanged(auth, u => u ? load(u) : signedOut());
</script>
